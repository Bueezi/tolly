  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <g transform="translate(54 54) scale(1.25) translate(-54 -54)" fill="#FFFFFF">
    <path d="M54,26 L84,40 L54,54 L24,40 Z"/>
    <path d="M47,47.5 L54,51 L61,47.5 L61,78 Q61,82 57,82 L51,82 Q47,82 47,78 Z"/>
