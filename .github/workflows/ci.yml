name: Android CI

# Builds and tests the Android app (android/) when it changes. The website is deployed by Cloudflare,
# not from here.
on:
  push:
    branches: [main]
    paths: ["android/**", "!android/fastlane/**", "!**.md", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["android/**", "!android/fastlane/**", "!**.md", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships an Android SDK; add the platform and build tools this project needs.
      - name: Install SDK packages
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          yes 2>/dev/null | "$sdkmanager" --licenses > /dev/null || true
          # Skip the download when the image already has them.
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ -d "$ANDROID_HOME/build-tools/37.0.0" ] && exit 0
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Caches dependencies, the build cache and (with the encryption key secret) the configuration
      # cache. Only main writes the cache; pull requests and tags read it.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: tolly-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
